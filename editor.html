<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Editor</title>
<meta name="robots" content="noindex">
<style>
:root{
  --paper:#f0eeea; --surface:#ffffff; --ink:#0d0d0c; --soft:#6b6b66;
  --line:#dcd9d3; --line2:#c9c5bd; --accent:#8a3b2a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.55 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lbl{display:block;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;
  height:62px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.bar .st{font-size:12px;color:var(--soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .st b{color:var(--ink);font-weight:600}
.b{border:1px solid var(--line2);background:var(--surface);padding:8px 14px;border-radius:2px;
  font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.b:hover{border-color:var(--ink)}
.b.p{background:var(--ink);border-color:var(--ink);color:#fff}
.b.p:hover{background:#2b2b28}
.b:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line2)}
.b.sm{padding:5px 9px;font-size:10px;letter-spacing:.06em}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:1px}

.shell{display:grid;grid-template-columns:188px minmax(0,1fr);min-height:calc(100vh - 62px)}
.shell.pv{grid-template-columns:188px minmax(0,1fr) clamp(380px,34vw,560px)}
nav{border-right:1px solid var(--line);padding:26px 0}
nav button{display:block;width:100%;text-align:left;padding:9px 24px;border:0;background:none;cursor:pointer;
  font-weight:600;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--soft)}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 2px 0 0 var(--ink)}
main{padding:34px 36px 90px;min-width:0}
aside{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
aside .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
aside iframe{flex:1;width:100%;border:0;background:#0b0b0b}

h2.sec{font-weight:700;font-size:30px;letter-spacing:-.025em;padding-bottom:4px}
.hint{font-size:13px;color:var(--soft);max-width:70ch;padding-bottom:26px}
.grp{background:var(--surface);border:1px solid var(--line);padding:22px 24px;margin-bottom:16px}
.grp>.gt{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.f{padding-bottom:14px}
.f:last-child{padding-bottom:0}
.f input[type=text],.f input[type=url],.f input[type=email],.f textarea,.f select{
  display:block;width:100%;margin-top:5px;padding:8px 10px;background:var(--paper);
  border:1px solid var(--line);border-radius:2px;font-size:13px}
.f textarea{resize:vertical;min-height:62px;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ink);outline:none;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;align-items:center;gap:8px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;padding-top:4px}

.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.sw{display:flex;align-items:center;gap:9px;margin-top:5px}
.sw input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line2);border-radius:2px;background:none;cursor:pointer}
.sw input[type=text]{flex:1;margin:0;padding:7px 8px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font-size:12px;font-family:ui-monospace,Consolas,monospace}

.item{border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.ih{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.ih:hover{background:#faf9f7}
.ih .tn{width:62px;height:35px;object-fit:cover;background:var(--paper);border:1px solid var(--line);flex-shrink:0}
.ih .tn.ns{display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.08em;color:var(--soft)}
.ih .nm{flex:1;min-width:0;overflow:hidden}
.ih .nm b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ih .nm span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.ih .ac{display:flex;gap:4px;flex-shrink:0}
.ib{padding:4px 16px 20px;border-top:1px solid var(--line)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tagrow .tg{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:2px;padding:3px 4px 3px 8px;font-size:12px;background:var(--paper)}
.tagrow .tg input{width:11ch;border:0;background:none;padding:0;font-size:12px}
.tagrow .tg button{border:0;background:none;cursor:pointer;color:var(--soft);font-size:14px;line-height:1;padding:0 2px}
.tagrow .tg button:hover{color:var(--accent)}

.imgf{display:flex;gap:12px;margin-top:6px;align-items:flex-start}
.imgf .pv2{width:132px;height:74px;flex-shrink:0;object-fit:cover;background:var(--paper);border:1px solid var(--line)}
.imgf .ctl{flex:1;min-width:0}
.imgf input{margin-top:0!important}
.imgf .ctl .row{padding-top:7px}
.drop{border:1px dashed var(--line2);padding:9px;margin-top:8px;text-align:center;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--soft);cursor:pointer}
.drop.on{border-color:var(--ink);color:var(--ink);background:#fff}

dialog{border:1px solid var(--line2);background:var(--surface);padding:0;width:min(880px,92vw);max-height:84vh;color:var(--ink)}
dialog::backdrop{background:rgba(13,13,12,.42)}
dialog .dh{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
dialog .dh b{flex:1;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
dialog .db{padding:18px 22px 24px;overflow:auto;max-height:68vh}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:12px}
.pick button{border:1px solid var(--line);background:none;padding:0;cursor:pointer;text-align:left}
.pick button:hover{border-color:var(--ink)}
.pick img,.pick .vid{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--paper)}
.pick .vid{display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.1em;color:var(--soft)}
.pick em{display:block;padding:6px 8px;font-style:normal;font-size:10px;color:var(--soft);word-break:break-all;line-height:1.35}
.note{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);padding:16px 20px;margin-bottom:22px;font-size:13px;max-width:80ch}
.note b{font-weight:600}
.note code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--paper);padding:1px 5px}
@media (max-width:1080px){.shell,.shell.pv{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}nav button{padding:14px 16px}aside{display:none}main{padding:24px 20px 80px}}
</style>
</head>
<body>

<div class="bar">
  <h1>Portfolio Editor</h1>
  <span class="st" id="status">Not connected</span>
  <button class="b" id="btnPv" type="button">Preview</button>
  <button class="b" id="btnConnect" type="button">Connect folder</button>
  <button class="b" id="btnDl" type="button">Download data.js</button>
  <button class="b p" id="btnSave" type="button" disabled>Save</button>
</div>

<div class="shell" id="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="aside">
    <div class="ph">
      <span class="lbl" style="flex:1">Live preview</span>
      <button class="b sm" id="btnReload" type="button">Reload</button>
      <a class="b sm" href="index.html" target="_blank" rel="noopener">Open ↗</a>
    </div>
    <iframe id="pvFrame" title="Site preview"></iframe>
  </aside>
</div>

<dialog id="picker">
  <div class="dh">
    <b>Choose a file</b>
    <input type="text" id="pickFilter" placeholder="filter…" style="padding:6px 9px;border:1px solid var(--line);background:var(--paper);border-radius:2px;font-size:12px">
    <button class="b sm" type="button" onclick="document.getElementById('picker').close()">Close</button>
  </div>
  <div class="db"><div class="pick" id="pickGrid"></div></div>
</dialog>

<script src="data.js"></script>
<script>
(function(){
"use strict";

var SECTIONS=[
  ["site","Site"],["hero","Hero"],["work","Work"],["cards","Projects"],
  ["about","About"],["contact","Contact"],["theme","Colors"]
];
var IMG=/\.(jpg|jpeg|png|webp|gif|avif|svg)$/i, VID=/\.(mp4|webm|mov)$/i;

var D=null, dir=null, fileH=null, assets=[], dirty=false, cur="site", open={};

/* ---------- plumbing ---------- */

function clone(o){return JSON.parse(JSON.stringify(o))}
function el(t,cls,txt){var n=document.createElement(t);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function $(id){return document.getElementById(id)}

function touch(){dirty=true;$("btnSave").disabled=!dir;setStatus()}

function setStatus(){
  var s=dir?("<b>"+dir.name+"</b> · data.js"):"Not connected — editing the bundled copy";
  $("status").innerHTML=s+(dirty?'<span class="dot" title="Unsaved changes"></span>':"");
}

function serialize(){return "window.SITE = "+JSON.stringify(D,null,2)+";\n"}

async function connect(){
  if(!window.showDirectoryPicker){
    alert("This browser can't open a folder directly.\n\nUse Chrome or Edge, or edit here and press “Download data.js” to replace the file by hand.");
    return;
  }
  try{ dir=await window.showDirectoryPicker({mode:"readwrite",id:"portfolio"}); }
  catch(e){ return; }
  try{
    fileH=await dir.getFileHandle("data.js");
    var txt=await (await fileH.getFile()).text();
    D=parseData(txt);
  }catch(e){
    alert("Couldn't read data.js in that folder.\nPick the folder that holds index.html.");
    dir=null;fileH=null;return;
  }
  dirty=false;$("btnSave").disabled=true;
  await scanAssets();
  render();setStatus();
}

function parseData(txt){
  var m=txt.replace(/^[\s\S]*?window\.SITE\s*=\s*/,"").replace(/;\s*$/,"");
  return JSON.parse(m);
}

async function save(){
  if(!fileH)return;
  var w=await fileH.createWritable();
  await w.write(serialize());
  await w.close();
  dirty=false;$("btnSave").disabled=true;setStatus();
  reloadPreview();
}

function download(){
  var b=new Blob([serialize()],{type:"text/javascript"});
  var a=el("a");a.href=URL.createObjectURL(b);a.download="data.js";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

async function scanAssets(){
  assets=[];
  if(!dir)return;
  async function walk(h,path){
    for await(var e of h.values()){
      var p=path?path+"/"+e.name:e.name;
      if(e.kind==="directory"){ await walk(e,p); }
      else if(IMG.test(e.name)||VID.test(e.name)) assets.push(p);
    }
  }
  try{ await walk(await dir.getDirectoryHandle("assets"),"assets"); }catch(e){}
  assets.sort();
}

async function dirAt(path){
  var h=dir, parts=path.split("/");
  for(var i=0;i<parts.length;i++) h=await h.getDirectoryHandle(parts[i],{create:true});
  return h;
}

async function importFile(file,dest){
  if(!dir){alert("Connect the project folder first to import files.");return null}
  var d=await dirAt(dest);
  var name=file.name.replace(/[^\w.\-]+/g,"-").toLowerCase();
  var fh=await d.getFileHandle(name,{create:true});
  var w=await fh.createWritable();await w.write(file);await w.close();
  var p=dest+"/"+name;
  if(assets.indexOf(p)<0){assets.push(p);assets.sort()}
  return p;
}

function reloadPreview(){
  var f=$("pvFrame");
  if($("shell").classList.contains("pv")) f.src="index.html?t="+Date.now();
}

/* ---------- field builders ---------- */

function text(obj,key,label,opts){
  opts=opts||{};
  var f=el("div","f"), l=el("label","lbl",label);
  var i=el(opts.area?"textarea":"input");
  if(!opts.area)i.type=opts.type||"text";
  if(opts.ph)i.placeholder=opts.ph;
  i.value=obj[key]==null?"":obj[key];
  i.addEventListener("input",function(){obj[key]=i.value;touch();if(opts.on)opts.on(i.value)});
  l.appendChild(i);f.appendChild(l);return f;
}

function i18n(obj,key,label,opts){
  opts=opts||{};
  if(obj[key]==null||typeof obj[key]!=="object")obj[key]={en:obj[key]||"",pt:""};
  var v=obj[key], f=el("div","f"), t=el("span","lbl",label), g=el("div","two");
  g.appendChild(wrap(v,"en","EN",opts));
  g.appendChild(wrap(v,"pt","PT",opts));
  f.appendChild(t);f.appendChild(g);
  return f;
}
function wrap(v,k,label,opts){
  var box=el("div"), l=el("label","lbl",label);
  var i=el(opts.area?"textarea":"input");
  if(!opts.area)i.type="text";
  i.value=v[k]==null?"":v[k];
  if(opts.ph)i.placeholder=opts.ph;
  i.addEventListener("input",function(){v[k]=i.value;touch();if(opts.on)opts.on()});
  l.appendChild(i);box.appendChild(l);box.className="f";box.style.paddingBottom="0";
  return box;
}

function color(obj,key,label){
  var f=el("div"), l=el("span","lbl",label), s=el("div","sw");
  var c=el("input");c.type="color";c.value=norm(obj[key]);
  var t=el("input");t.type="text";t.value=obj[key]||"";
  c.addEventListener("input",function(){obj[key]=c.value.toUpperCase();t.value=obj[key];touch()});
  t.addEventListener("input",function(){obj[key]=t.value;if(/^#[0-9a-f]{6}$/i.test(t.value))c.value=t.value;touch()});
  s.appendChild(c);s.appendChild(t);f.appendChild(l);f.appendChild(s);return f;
}
function norm(v){return /^#[0-9a-f]{6}$/i.test(v||"")?v:"#000000"}

function imageField(obj,key,label,dest){
  dest=dest||"assets/work";
  var f=el("div","f"), l=el("span","lbl",label), box=el("div","imgf");
  var pv=el("img","pv2");pv.alt="";
  var ctl=el("div","ctl");
  var i=el("input");i.type="text";i.value=obj[key]||"";i.placeholder="assets/work/…";
  i.style.cssText="display:block;width:100%;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font-size:13px";
  var row=el("div","row");
  var pick=el("button","b sm","Choose…");pick.type="button";
  var clr=el("button","b sm","Clear");clr.type="button";
  var drop=el("div","drop","Drop an image here to add it to "+dest);

  function show(v){
    if(v&&VID.test(v)){pv.removeAttribute("src");pv.style.background="#1c1c1a"}
    else if(v){pv.src=v;pv.style.background=""}
    else{pv.removeAttribute("src");pv.style.background=""}
  }
  function set(v){obj[key]=v;i.value=v;show(v);touch()}
  show(obj[key]);
  i.addEventListener("input",function(){obj[key]=i.value;show(i.value);touch()});
  pick.addEventListener("click",function(){openPicker(set)});
  clr.addEventListener("click",function(){set("")});

  drop.addEventListener("click",function(){
    var inp=el("input");inp.type="file";inp.accept="image/*,video/mp4,video/webm";
    inp.addEventListener("change",async function(){
      if(inp.files[0]){var p=await importFile(inp.files[0],dest);if(p)set(p)}
    });
    inp.click();
  });
  ["dragenter","dragover"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("on")})});
  ["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("on")})});
  drop.addEventListener("drop",async function(e){
    var file=e.dataTransfer.files[0];
    if(file){var p=await importFile(file,dest);if(p)set(p)}
  });

  row.appendChild(pick);row.appendChild(clr);
  ctl.appendChild(i);ctl.appendChild(row);ctl.appendChild(drop);
  box.appendChild(pv);box.appendChild(ctl);
  f.appendChild(l);f.appendChild(box);return f;
}

function openPicker(cb){
  var dlg=$("picker"), grid=$("pickGrid"), filt=$("pickFilter");
  function draw(){
    var q=filt.value.toLowerCase();
    grid.innerHTML="";
    var list=assets.filter(function(a){return a.toLowerCase().indexOf(q)>=0});
    if(!list.length){
      grid.appendChild(el("p",null,dir?"No matching files in assets/.":"Connect the project folder to browse assets/."));
      return;
    }
    list.slice(0,400).forEach(function(p){
      var b=el("button");b.type="button";
      if(IMG.test(p)){var im=el("img");im.src=p;im.loading="lazy";im.alt="";b.appendChild(im)}
      else b.appendChild(el("div","vid","VIDEO"));
      b.appendChild(el("em",null,p));
      b.addEventListener("click",function(){cb(p);dlg.close()});
      grid.appendChild(b);
    });
  }
  filt.oninput=draw;filt.value="";draw();dlg.showModal();
}

function strList(arr,label){
  var f=el("div","f"), l=el("span","lbl",label), row=el("div","tagrow");
  function draw(){
    row.innerHTML="";
    arr.forEach(function(v,idx){
      var tg=el("span","tg");
      var i=el("input");i.type="text";i.value=v;
      i.style.width=Math.max(6,v.length+1)+"ch";
      i.addEventListener("input",function(){arr[idx]=i.value;i.style.width=Math.max(6,i.value.length+1)+"ch";touch()});
      var x=el("button",null,"×");x.type="button";x.title="Remove";
      x.addEventListener("click",function(){arr.splice(idx,1);touch();draw()});
      tg.appendChild(i);tg.appendChild(x);row.appendChild(tg);
    });
    var add=el("button","b sm","+ Add");add.type="button";
    add.addEventListener("click",function(){arr.push("New");touch();draw()});
    row.appendChild(add);
  }
  draw();f.appendChild(l);f.appendChild(row);return f;
}

/* generic list of objects with header + collapsible body */
function list(arr,cfg){
  var host=el("div");
  function draw(){
    host.innerHTML="";
    arr.forEach(function(o,idx){
      var key=cfg.key+":"+idx;
      var it=el("div","item"), h=el("div","ih");
      if(cfg.thumb){
        var src=cfg.thumb(o);
        if(src&&IMG.test(src)){var im=el("img","tn");im.src=src;im.alt="";im.loading="lazy";h.appendChild(im)}
        else h.appendChild(el("div","tn ns",src?"VIDEO":"NO IMG"));
      }
      var nm=el("div","nm");
      nm.appendChild(el("b",null,cfg.title(o)||"Untitled"));
      nm.appendChild(el("span",null,cfg.sub?cfg.sub(o):""));
      h.appendChild(nm);
      var ac=el("div","ac");
      [["↑",function(){if(idx>0){arr.splice(idx-1,0,arr.splice(idx,1)[0]);touch();draw()}}],
       ["↓",function(){if(idx<arr.length-1){arr.splice(idx+1,0,arr.splice(idx,1)[0]);touch();draw()}}]]
      .forEach(function(p){var b=el("button","b sm",p[0]);b.type="button";
        b.addEventListener("click",function(e){e.stopPropagation();p[1]()});ac.appendChild(b)});
      if(cfg.dup){var dp=el("button","b sm","Copy");dp.type="button";
        dp.addEventListener("click",function(e){e.stopPropagation();arr.splice(idx+1,0,clone(o));touch();draw()});ac.appendChild(dp)}
      var rm=el("button","b sm","Delete");rm.type="button";
      rm.addEventListener("click",function(e){
        e.stopPropagation();
        if(confirm('Delete "'+(cfg.title(o)||"this item")+'"?')){arr.splice(idx,1);touch();draw()}
      });
      ac.appendChild(rm);h.appendChild(ac);
      h.addEventListener("click",function(){open[key]=!open[key];draw()});
      it.appendChild(h);
      if(open[key]){
        var b=el("div","ib");
        cfg.body(o,b,draw);
        it.appendChild(b);
      }
      host.appendChild(it);
    });
    var add=el("button","b","+ "+cfg.addLabel);add.type="button";
    add.addEventListener("click",function(){arr.push(clone(cfg.blank));open[cfg.key+":"+(arr.length-1)]=true;touch();draw()});
    host.appendChild(add);
  }
  draw();return host;
}

function group(title,nodes,right){
  var g=el("div","grp"), t=el("div","gt");
  t.appendChild(el("span",null,title));
  if(right)t.appendChild(right);
  g.appendChild(t);
  nodes.forEach(function(n){if(n)g.appendChild(n)});
  return g;
}

/* ---------- sections ---------- */

var BLANK={
  card:{cat:"",href:"",newTab:true,image:"",alt:"",icon:"",badge:{en:"",pt:""},tag:{en:"",pt:""},
        title:{en:"New project",pt:""},desc:{en:"",pt:""},noshot:{big:"",sub:{en:"",pt:""}}},
  cat:{id:"new",label:{en:"New",pt:""}},
  job:{when:{en:"",pt:""},title:{en:"New role",pt:""},what:{en:"",pt:""},p:{en:"",pt:""}},
  skill:{k:{en:"New group",pt:""},items:[]},
  link:{label:"Link ↗",href:""},
  tag:{text:{en:"New tag",pt:""},bg:"#4C1D95",fg:"#FFFFFF"}
};

var VIEWS={};

VIEWS.site=function(m){
  m.appendChild(group("Brand",[
    text(D.brand,"name","Logo text"),
    imageField(D.brand,"logo","Logo image","assets")
  ]));
  m.appendChild(group("Navigation labels",[
    i18n(D.nav,"work","Work link"),
    i18n(D.nav,"about","About link"),
    i18n(D.nav,"contact","Contact link"),

VIEWS.cards=function(m){
  var cats=D.work.categories.filter(function(c){return c.id!=="all"});
  var blank=clone(BLANK.card);
  if(cats.length)blank.cat=cats[0].id;
  m.appendChild(el("p","hint","Order here is the order on the page. Leave the image empty for a text-only card."));
  m.appendChild(list(D.work.cards,{
    key:"card",addLabel:"Add project",blank:blank,dup:true,
    thumb:function(o){return o.image},
    title:function(o){return o.title&&o.title.en},
    sub:function(o){return (o.cat||"no category")+(o.href?"":" · no link")},
    body:function(o,b){
      var f=el("div","f"), l=el("span","lbl","Category"), s=el("select");
      cats.forEach(function(c){var op=el("option",null,c.label.en+"  ("+c.id+")");op.value=c.id;s.appendChild(op)});
      if(cats.map(function(c){return c.id}).indexOf(o.cat)<0){var op=el("option",null,o.cat||"— none —");op.value=o.cat||"";s.appendChild(op)}
      s.value=o.cat||"";
      s.addEventListener("change",function(){o.cat=s.value;touch()});
      s.style.cssText="display:block;width:100%;margin-top:5px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font-size:13px";
      l.appendChild(s);f.appendChild(l);b.appendChild(f);

      b.appendChild(i18n(o,"title","Title"));
      b.appendChild(i18n(o,"desc","Description",{area:true}));
      var two=el("div","two");
      two.appendChild(i18n(o,"badge","Filled badge"));
      two.appendChild(i18n(o,"tag","Outlined badge"));
      b.appendChild(two);

      b.appendChild(text(o,"href","Link (leave empty for no link)"));
      var ck=el("label","chk"), c2=el("input");c2.type="checkbox";c2.checked=o.newTab!==false;
      c2.addEventListener("change",function(){o.newTab=c2.checked;touch()});
      ck.appendChild(c2);ck.appendChild(el("span",null,"Open in a new tab"));
      b.appendChild(ck);

      b.appendChild(imageField(o,"image","Image"));
      b.appendChild(imageField(o,"icon","Icon","assets/icons"));
      b.appendChild(i18n(o,"alt","Image description (alt)"));

      if(!o.noshot)o.noshot={big:"",sub:{en:"",pt:""}};
      var ns=el("div","grp");ns.style.cssText="margin:14px 0 0;background:var(--paper)";
      ns.appendChild(el("div","gt","No-image fallback"));
      ns.appendChild(text(o.noshot,"big","Big text"));
      ns.appendChild(i18n(o.noshot,"sub","Small text"));
      b.appendChild(ns);
    }
  }));
};

/* ---------- shell ---------- */

function render(){
  var m=$("main");m.innerHTML="";
  if(!D){m.appendChild(el("p","hint","data.js not loaded."));return}
  var name=(SECTIONS.filter(function(s){return s[0]===cur})[0]||["","?"])[1];
  m.appendChild(el("h2","sec",name));
  if(!dir){
    var n=el("div","note");
    n.innerHTML="<b>Not connected.</b> Press <b>Connect folder</b> and pick the folder that holds <code>index.html</code> — then Save writes <code>data.js</code> straight to disk and you can drop in new images. Without it you can still edit and use <b>Download data.js</b>.";
    m.appendChild(n);
  }
  (VIEWS[cur]||function(){})(m);
}

function buildNav(){
  var n=$("nav");n.innerHTML="";
  SECTIONS.forEach(function(s){
    var b=el("button",null,s[1]);b.type="button";
    b.setAttribute("aria-current",s[0]===cur?"true":"false");
    b.addEventListener("click",function(){cur=s[0];buildNav();render();window.scrollTo(0,0)});
    n.appendChild(b);
  });
}

$("btnConnect").addEventListener("click",connect);
$("btnSave").addEventListener("click",save);
$("btnDl").addEventListener("click",download);
$("btnReload").addEventListener("click",reloadPreview);
$("btnPv").addEventListener("click",function(){
  var on=$("shell").classList.toggle("pv");
  if(on)reloadPreview();else $("pvFrame").removeAttribute("src");
});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();if(dir)save();else download()}
});
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});

D=window.SITE?clone(window.SITE):null;
buildNav();render();setStatus();
})();
</script>
