<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eduardo Fernandes · Technical Artist</title>
<meta name="description" content="Eduardo Fernandes — Technical Artist and 3D Artist. HLSL shaders for URP, Unity and Maya tools, and game-ready art for mobile and web games live on Poki.">
<meta property="og:title" content="Eduardo Fernandes · Technical Artist">
<meta property="og:description" content="Shaders, tools and art that runs. Kreativitas Studio, Sorocaba, Brazil.">
<meta property="og:image" content="https://eduardofernandes3d.github.io/assets/work/snake-play-keyart.jpg">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="assets/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<script src="data.js"></script>
<script>
window.applyTheme=function(t){if(!t)return;var m={bg:"--bg",band:"--band",ink:"--ink",dim:"--dim",body:"--body",violet:"--violet",bandSub:"--band-sub",gold:"--gold",line:"--line",bandHover:"--band-hover"};
for(var k in m)if(t[k])document.documentElement.style.setProperty(m[k],t[k])};
window.applyTheme((window.SITE||{}).theme);
</script>
<style>
:root{
  --bg:#0B0B0B; --band:#4C1D95; --ink:#FFFFFF; --dim:#9A9A92;
  --body:#D6D6CE; --violet:#A78BFA; --band-sub:#C9B8F0; --gold:#F5C518;
  --line:#2A2A26; --wrap:1328px; --gut:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 Poppins,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:40px;font-weight:700;font-size:12px;letter-spacing:.04em;padding:10px 18px}
.btn{background:var(--band);color:#fff;padding:13px 22px;border-radius:40px;font-weight:700;font-size:12px;letter-spacing:.06em}
.btn:hover{background:var(--band-hover,#5B29AD)}
.tl{font-size:14px;border-bottom:1px solid var(--violet);padding-bottom:2px}
.more{display:inline-flex;align-items:center;gap:11px;background:var(--bg);color:#fff;padding:17px 34px;border-radius:40px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:background .18s ease}
.more::after{content:"↓";color:var(--violet);font-size:13px}
.more:hover{background:#17171A}

.top{position:sticky;top:0;z-index:30;background:rgba(11,11,11,.9);backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:76px;gap:20px}
.mark{display:flex;align-items:center;gap:12px;min-width:0}
.mark img{width:44px;height:56px;object-fit:contain}
.mark span{font-weight:800;font-size:16px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;align-items:center;gap:26px}
.nav a{font-weight:500;font-size:13px;color:var(--dim)}
.nav a:hover{color:var(--ink)}
.lang{display:flex;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim)}
.lang b{font-weight:600;color:var(--ink)}

.hero{position:relative;min-height:620px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(76,29,149,0) 64%,rgba(76,29,149,.55) 86%,var(--band) 100%),linear-gradient(100deg,rgba(11,11,11,.95) 0%,rgba(11,11,11,.88) 34%,rgba(11,11,11,.42) 66%,rgba(11,11,11,.30) 100%)}
.hero .in{position:relative;z-index:2;padding-top:120px;padding-bottom:56px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.hero h1{font-weight:800;font-size:clamp(2.5rem,6.4vw,5.75rem);line-height:.96;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--violet)}
.hero p{max-width:40ch;color:var(--body);font-size:clamp(1rem,1.3vw,1.0625rem)}

.band{background:var(--band);padding:76px 0 56px}
.band .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.band h2{font-weight:800;font-size:clamp(2rem,4.2vw,3.5rem);line-height:1.04;letter-spacing:-.03em}
.band .head p{color:var(--band-sub);font-size:16px}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding-top:10px}
.filters button{border-radius:40px;padding:11px 22px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid #fff;color:#fff}
.filters button[aria-pressed="true"]{background:var(--bg);border-color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:36px}
.card{display:flex;flex-direction:column;background:var(--bg);border-radius:18px;overflow:hidden}
.card[hidden]{display:none}
.card.peek{height:160px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 16%,transparent 94%);mask-image:linear-gradient(180deg,#000 0,#000 16%,transparent 94%)}
.card:hover{transform:translateY(-3px)}
.card{transition:transform .22s ease}
.card>.photo{position:relative;aspect-ratio:16/9;overflow:hidden;background:#141412}
.card>.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card[href^="snake-vs-human-skills.html"]>.photo::after{content:"";position:absolute;inset:0;background:url(assets/skills/overlay.png) center bottom/100% auto no-repeat;pointer-events:none}
.card>.noshot{aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 26px;background:#141412;border-bottom:1px solid var(--line);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.card>.noshot b{font-weight:800;font-size:27px;letter-spacing:-.025em;text-transform:none;color:var(--violet)}
.card .body{display:flex;flex-direction:column;gap:10px;padding:22px 24px 26px}
.card .meta{display:flex;flex-wrap:wrap;gap:7px}
.card .meta span{border-radius:40px;padding:5px 11px;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.card .meta .k{background:var(--band);color:#fff}
.card .meta .t{border:1px solid #3A3A32;color:var(--dim)}
.card>.shot{position:relative;aspect-ratio:16/9;overflow:hidden;background:#141412;border-bottom:1px solid var(--line)}
.card>.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px}
.card>.shot img:not(.bg){top:18px;bottom:auto;left:50%;right:auto;height:calc(100% - 36px);width:auto;aspect-ratio:1;transform:translateX(-50%);padding:0;border-radius:22%}
.card>.shot .bg{padding:0;object-fit:cover;filter:blur(26px) saturate(1.2) brightness(.8);transform:scale(1.35)}
.card h3{font-weight:700;font-size:22px;letter-spacing:-.02em}
.card p{font-size:14px;line-height:1.57;color:var(--dim)}
.band .all{display:flex;justify-content:center;padding-top:34px}
.band .more-row{padding-top:20px}
.band .all a.tl{font-size:13px;color:var(--band-sub);border-bottom-color:transparent}
.band .all a.tl:hover{color:#fff;border-bottom-color:#fff}

.about{padding:88px 0}
.about .lbl{font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.about h2{font-weight:800;font-size:clamp(1.9rem,3.6vw,2.75rem);line-height:1.06;letter-spacing:-.03em;padding:14px 0 26px}
.spread{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:start}
.about p{color:var(--body);font-size:16px;line-height:1.72;max-width:58ch}
.skills{display:flex;flex-direction:column;gap:0;padding-top:28px}
.skill{display:grid;grid-template-columns:104px 1fr;gap:18px;padding:15px 0;border-top:1px solid var(--line)}
.skill:last-child{border-bottom:1px solid var(--line)}
.skill .k{font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{border:1px solid var(--line);border-radius:40px;padding:6px 12px;font-size:12px;color:var(--body)}
.job{padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.job .when{font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet)}
.job h3{font-weight:700;font-size:19px;letter-spacing:-.01em;padding:7px 0 2px}
.job .what{font-size:13px;color:var(--dim);padding-bottom:8px}
.job p{font-size:14px;line-height:1.6}

.contact{padding:96px 0 72px;border-top:1px solid var(--line)}
.crow{display:flex;align-items:center;gap:44px}
.crow>img{width:104px;height:134px;flex-shrink:0;object-fit:contain}
.cmain{display:flex;flex-direction:column;gap:12px;flex-grow:1}
.contact h2{font-weight:800;font-size:clamp(1.7rem,3.4vw,2.75rem);line-height:1.08;letter-spacing:-.03em}
.contact .mail{font-size:17px;color:var(--violet);border-bottom:1px solid transparent}
.contact .mail:hover{border-bottom-color:var(--violet)}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:14px;flex-shrink:0}
.cside .links{display:flex;gap:18px;font-size:13px;color:var(--dim)}
.cside .links a:hover{color:var(--ink)}
.foot{display:flex;justify-content:space-between;gap:16px;padding:22px 0;border-top:1px solid var(--line);font-size:12px;letter-spacing:.06em;color:var(--dim)}

html.edit [data-edit]{cursor:pointer}
html.edit [data-edit]:hover{outline:2px dashed var(--violet);outline-offset:-2px}

@media (max-width:600px){
  .mark span{display:none}
}
@media (max-width:900px){
  :root{--gut:22px}
  .nav a[href^="#"]{display:none}
  .nav{gap:14px}
  .mark img{width:36px;height:46px}
  .mark span{font-size:11px;letter-spacing:.08em}
  .btn{white-space:nowrap}
  .bar{height:64px}
  .hero{min-height:0}
  .hero .in{padding-top:88px;padding-bottom:40px}
  .hero p{max-width:none}
  .band{padding:52px 0 44px}
  .grid{grid-template-columns:1fr;gap:16px}
  .about{padding:56px 0}
  .spread{grid-template-columns:1fr;gap:40px}
  .skill{grid-template-columns:1fr;gap:8px}
  .skill .k{padding-top:0}
  .contact{padding:60px 0 48px}
  .crow{flex-direction:column;align-items:flex-start;gap:24px}
  .cside{align-items:flex-start}
  .foot{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top" data-edit="site"><div class="wrap bar">
  <a class="mark" href="#top"><img id="markLogo" src="" alt=""><span id="markName"></span></a>
  <nav class="nav">
    <a href="#work" id="navWork"></a>
    <a href="#about" id="navAbout"></a>
    <a href="#contact" id="navContact"></a>
    <button class="lang" id="langSwitch" type="button" aria-label="Português">
      <b data-v="en">EN</b><span aria-hidden="true">·</span><span data-v="pt">PT</span>
    </button>
    <a class="btn resume" id="navResume" href=""></a>
  </nav>
</div></header>

<section class="hero" id="top" data-edit="hero">
  <img id="heroImg" src="" alt="">
  <div class="wrap in">
    <div class="tags" id="heroTags"></div>
    <h1 id="heroH1"></h1>
    <p id="heroP"></p>
  </div>
</section>

<section class="band" id="work">
  <div class="wrap">
    <div class="head" data-edit="work">
      <h2 id="workH2"></h2>
      <p id="workP"></p>
      <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="all more-row"><button class="more" id="showMore" type="button" hidden></button></p>
    <p class="all"><a class="tl" id="allLink" href="" target="_blank" rel="noopener"></a></p>
  </div>
</section>

<section class="about" id="about" data-edit="about"><div class="wrap">
  <span class="lbl" id="abLabel"></span>
  <h2 id="abH2"></h2>
  <div class="spread">
    <div>
      <p id="abP"></p>
      <div class="skills" id="skills"></div>
    </div>
    <div id="jobs"></div>
  </div>
</div></section>

<section class="contact" id="contact" data-edit="contact"><div class="wrap">
  <div class="crow">
    <img id="ctImg" src="" alt="">
    <div class="cmain">
      <h2 id="ctH2"></h2>
      <a class="mail" id="ctMail" href=""></a>
    </div>
    <div class="cside">
      <a class="btn resume" id="ctResume" href=""></a>
      <div class="links" id="ctLinks"></div>
    </div>
  </div>
</div></section>

<div class="wrap foot" data-edit="site"><span id="footL"></span><span id="footR"></span></div>

<script>
(function(){
  var S=window.SITE,lang="en",filter="all",expanded=false,LIMIT=6,editMode=false;
  if(!S){document.body.innerHTML='<p style="padding:40px">data.js failed to load.</p>';return}

  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function t(v){return v==null?"":(typeof v==="string"?v:(v[lang]||v.en||""))}
  function el(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

  function fitStyle(f){
    if(!f)return "";
    var x=+f.x||0,y=+f.y||0,z=+f.z||1;
    if(!x&&!y&&z===1)return "";
    return ' style="transform:translate('+x+'%,'+y+'%) scale('+z+')"';
  }

  function card(c,i){
    var tag=c.href?"a":"div",attr=c.href?' href="'+esc(c.href)+'"'+(c.newTab?' target="_blank" rel="noopener"':""):"";
    var shot=c.icon
      ? '<span class="shot"><img class="bg" src="'+esc(c.icon)+'" alt="" aria-hidden="true" loading="lazy"><img src="'+esc(c.icon)+'" alt="'+esc(t(c.title))+'" loading="lazy"></span>'
      : c.image
      ? '<span class="photo"><img src="'+esc(c.image)+'" alt="'+esc(t(c.alt))+'" loading="lazy"'+fitStyle(c.fit)+'></span>'
      : '<span class="noshot"><b>'+esc(c.noshot&&c.noshot.big||t(c.title))+'</b>'+esc(t(c.noshot&&c.noshot.sub))+'</span>';
    var meta="";
    if(t(c.badge))meta+='<span class="k">'+esc(t(c.badge))+'</span>';
    if(t(c.tag))meta+='<span class="t">'+esc(t(c.tag))+'</span>';
    if(t(c.tag2))meta+='<span class="t">'+esc(t(c.tag2))+'</span>';
    return '<'+tag+' class="card" data-c="'+esc(c.cat||"")+'" data-edit="card:'+i+'"'+attr+'>'+shot
      +'<div class="body"><div class="meta">'+meta+'</div><h3>'+t(c.title)+'</h3><p>'+t(c.desc)+'</p></div></'+tag+'>';
  }

  function applyFilter(){
    var n=0,cap=(filter==="all"&&!expanded)?LIMIT:Infinity,pk=window.innerWidth<=900?1:3;
    [].forEach.call(document.querySelectorAll("#grid .card"),function(c){
      var m=filter==="all"||c.getAttribute("data-c")===filter,i=m?n++:-1;
      var peek=m&&i>=cap&&i<cap+pk;
      c.hidden=!(m&&(i<cap||peek));
      c.classList.toggle("peek",peek);
      if(peek){c.setAttribute("aria-hidden","true");c.setAttribute("tabindex","-1")}
      else{c.removeAttribute("aria-hidden");c.removeAttribute("tabindex")}
    });
    el("showMore").hidden=!(filter==="all"&&!expanded&&n>LIMIT);
    [].forEach.call(document.querySelectorAll("#filters button"),function(b){
      b.setAttribute("aria-pressed",b.getAttribute("data-f")===filter?"true":"false");
    });
  }

  function render(){
    document.documentElement.setAttribute("lang",lang==="pt"?"pt-BR":"en");

    el("markLogo").src=S.brand.logo; el("markName").textContent=S.brand.name;
    el("navWork").textContent=t(S.nav.work);
    el("navAbout").textContent=t(S.nav.about);
    el("navContact").textContent=t(S.nav.contact);
    el("navResume").textContent=t(S.nav.resume);

    el("heroImg").src=S.hero.image; el("heroImg").alt=t(S.hero.alt);
    el("heroTags").innerHTML=(S.hero.tags||[]).map(function(x,i){
      return '<span class="pill" data-edit="htag:'+i+'" style="background:'+esc(x.bg)+';color:'+esc(x.fg)+'">'+esc(t(x.text))+'</span>';
    }).join("");
    el("heroH1").innerHTML=t(S.hero.h1);
    el("heroP").innerHTML=t(S.hero.p);

    el("workH2").innerHTML=t(S.work.h2);
    el("workP").innerHTML=t(S.work.p);
    el("filters").innerHTML=(S.work.categories||[]).map(function(c,i){
      return '<button type="button" data-f="'+esc(c.id)+'" data-edit="cat:'+i+'" aria-pressed="false">'+esc(t(c.label))+'</button>';
    }).join("");
    el("grid").innerHTML=(S.work.cards||[]).map(card).join("");
    el("showMore").textContent=t(S.work.more);
    el("allLink").href=S.work.allLink.href;
    el("allLink").innerHTML=t(S.work.allLink.label);

    el("abLabel").textContent=t(S.about.label);
    el("abH2").innerHTML=t(S.about.h2);
    el("abP").innerHTML=t(S.about.p);
    el("skills").innerHTML=(S.about.skills||[]).map(function(s,i){
      var list=s.itemsI18n?s.itemsI18n.map(t):(s.items||[]);
      return '<div class="skill" data-edit="skill:'+i+'"><span class="k">'+esc(t(s.k))+'</span><div class="chips">'
        +list.map(function(i){return "<span>"+esc(i)+"</span>"}).join("")+"</div></div>";
    }).join("");
    el("jobs").innerHTML=(S.about.jobs||[]).map(function(j,i){
      return '<div class="job" data-edit="job:'+i+'"><div class="when">'+esc(t(j.when))+'</div><h3>'+esc(t(j.title))
        +'</h3><div class="what">'+esc(t(j.what))+'</div><p>'+t(j.p)+"</p></div>";
    }).join("");

    el("ctImg").src=S.contact.image;
    el("ctH2").innerHTML=t(S.contact.h2);
    el("ctMail").textContent=S.contact.email;
    el("ctMail").href="mailto:"+S.contact.email;
    el("ctResume").textContent=t(S.contact.resumeLabel);
    el("ctLinks").innerHTML=(S.contact.links||[]).map(function(l){
      return '<a href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(l.label)+"</a>";
    }).join("");
    el("footL").innerHTML=t(S.footer.left);
    el("footR").innerHTML=t(S.footer.right);

    [].forEach.call(document.querySelectorAll(".resume"),function(r){r.href=S.resume[lang]||S.resume.en});

    var ls=el("langSwitch");
    [].forEach.call(ls.children,function(c){
      var v=c.getAttribute("data-v");if(!v)return;
      var want=v===lang?"B":"SPAN";
      if(c.tagName===want)return;
      var n=document.createElement(want==="B"?"b":"span");
      n.setAttribute("data-v",v);n.textContent=c.textContent;c.replaceWith(n);
    });
    ls.setAttribute("aria-label",lang==="pt"?"English":"Português");

    applyFilter();
  }

  el("filters").addEventListener("click",function(e){
    var b=e.target.closest("button[data-f]");if(!b)return;
    filter=b.getAttribute("data-f");expanded=false;applyFilter();
  });
  el("showMore").addEventListener("click",function(){expanded=true;applyFilter()});
  window.addEventListener("resize",applyFilter);
  el("langSwitch").addEventListener("click",function(){
    lang=lang==="pt"?"en":"pt";store("ef-lang",lang);render();
  });

  window.addEventListener("message",function(e){
    if(e.origin!==location.origin)return;
    var d=e.data||{};
    if(d.site){S=window.SITE=d.site;if(window.applyTheme)window.applyTheme(S.theme);render()}
    if("editMode" in d){editMode=!!d.editMode;document.documentElement.classList.toggle("edit",editMode)}
  });
  document.addEventListener("click",function(e){
    if(!editMode||!e.target.closest)return;
    var n=e.target.closest("[data-edit]");
    if(!n)return;
    e.preventDefault();e.stopPropagation();
    try{parent.postMessage({editPath:n.getAttribute("data-edit")},location.origin)}catch(_){}
  },true);

  lang=read("ef-lang")==="pt"?"pt":"en";
  render();
})();
</script>
</body>
</html>
